spring:
  application:
    name: securityhub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securityhub}
    username: ${DB_USER:securityhub}
    password: ${DB_PASSWORD:securityhub}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
    time-zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: ${SECURITYHUB_UPLOAD_MAX_SIZE:10MB}
      max-request-size: ${SECURITYHUB_UPLOAD_MAX_SIZE:10MB}

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

securityhub:
  jwt:
    secret: ${SECURITYHUB_JWT_SECRET:}
    expiration-minutes: ${SECURITYHUB_JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${SECURITYHUB_REFRESH_EXPIRATION_DAYS:14}
    issuer: securityhub
  cors:
    allowed-origins: ${SECURITYHUB_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo:
    seed-enabled: false
  mail:
    from: ${SECURITYHUB_MAIL_FROM:nao-responda@securityhub.local}
    # Base dos links enviados por e-mail. Aponta para o frontend, não para a API.
    app-base-url: ${SECURITYHUB_APP_BASE_URL:http://localhost:4200}
  attachments:
    directory: ${SECURITYHUB_ATTACHMENTS_DIR:./uploads}
    max-size-bytes: 10485760
  scan:
    max-upload-bytes: 10485760

logging:
  level:
    root: INFO
    com.securityhub: ${SECURITYHUB_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
