spring:
  application:
    name: securityhub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securityhub}
    username: ${DB_USER:securityhub}
    password: ${DB_PASSWORD:securityhub}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
    time-zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: ${SECURITYHUB_UPLOAD_MAX_SIZE:10MB}
      max-request-size: ${SECURITYHUB_UPLOAD_MAX_SIZE:10MB}

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  # Tráfego de gestão não é tráfego de tenant.
  #
  # Até aqui os endpoints do actuator viviam na porta da aplicação, e `/actuator/metrics` não
  # está em SecurityConfig.PUBLIC_ENDPOINTS — caía em `anyRequest().authenticated()`. Qualquer
  # usuário autenticado, de qualquer papel, inclusive VIEWER, lia dali todos os templates de
  # URI do servidor, a contagem por endpoint, o estado do pool de conexões e a versão da JVM.
  #
  # Restringir `/actuator/**` a hasRole('ADMIN') seria a correção errada: o ADMIN deste produto
  # é o administrador de um cliente, não um operador — não existe papel de operador. As métricas
  # da JVM não são dele. Por isso a gestão sai da porta do tenant e passa a ter porta própria.
  #
  # ATENÇÃO: o que protege esta porta é ISOLAMENTO DE REDE, e não a autenticação.
  #
  # O contexto filho criado por `management.server.port` herda o springSecurityFilterChain do
  # contexto pai no Boot 2.7 — verificado na pilha do compose —, então /actuator aqui até pede
  # um token. Mas o token que ele aceita é o de qualquer usuário de qualquer papel, inclusive
  # VIEWER: é a mesma cadeia da aplicação, com o mesmo `anyRequest().authenticated()`. Isso não
  # é uma autorização de operador, é só uma tranca a mais.
  #
  # O controle de verdade é o bind em loopback declarado no docker-compose.yml
  # (`127.0.0.1:9090:9090`). É ele que precisa sobreviver a qualquer mudança nesta configuração.
  server:
    port: ${SECURITYHUB_MANAGEMENT_PORT:9090}
  health:
    # O envio de e-mail é deliberadamente tolerante a falha (docs/adr/0007): a entrega
    # acontece fora da transação e fora da thread da requisição, e uma exceção é registrada
    # em vez de propagada. Um indicador que derruba /actuator/health quando o SMTP está fora
    # contradiz isso — tiraria a aplicação de rotação por uma dependência que ela foi escrita
    # para sobreviver.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

securityhub:
  jwt:
    secret: ${SECURITYHUB_JWT_SECRET:}
    expiration-minutes: ${SECURITYHUB_JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${SECURITYHUB_REFRESH_EXPIRATION_DAYS:14}
    issuer: securityhub
  cors:
    allowed-origins: ${SECURITYHUB_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo:
    seed-enabled: false
  mail:
    from: ${SECURITYHUB_MAIL_FROM:nao-responda@securityhub.local}
    # Base dos links enviados por e-mail. Aponta para o frontend, não para a API.
    app-base-url: ${SECURITYHUB_APP_BASE_URL:http://localhost:4200}
  attachments:
    directory: ${SECURITYHUB_ATTACHMENTS_DIR:./uploads}
    max-size-bytes: 10485760
  scan:
    max-upload-bytes: 10485760

logging:
  level:
    root: INFO
    com.securityhub: ${SECURITYHUB_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
