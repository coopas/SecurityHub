# Demo profile used by docker-compose. Seeds a reproducible data set on startup.
securityhub:
  demo:
    seed-enabled: true
    # Public credential of the local demo, and not a secret. The `demo` tenant only exists
    # inside a database the user has just created on their own machine with
    # `docker compose up`; there is nothing behind this password beyond fictitious data
    # generated on the first boot. It is public on purpose so that the README and
    # docs/http/securityhub.http can document a single credential.
    #
    # Any exposed deployment (a hosted demo, a shared environment, anything reachable outside
    # localhost) must override SECURITYHUB_DEMO_PASSWORD — or turn the seed off with
    # securityhub.demo.seed-enabled=false.
    password: ${SECURITYHUB_DEMO_PASSWORD:Demo@SecurityHub2026}

logging:
  level:
    com.securityhub: INFO
