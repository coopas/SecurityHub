# Integration tests run against a real PostgreSQL 15 provided by Testcontainers; the
# datasource URL is injected at runtime by AbstractIntegrationTest.
securityhub:
  jwt:
    secret: test-only-secret-value-used-exclusively-by-the-automated-test-suite
    expiration-minutes: 60
    refresh-expiration-days: 14
  cors:
    allowed-origins: http://localhost:4200
  demo:
    seed-enabled: false
  mail:
    from: nao-responda@securityhub.test
    app-base-url: http://localhost:4200

spring:
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.securityhub: INFO
    # There is no SMTP in the suite: every delivery fails and would be one WARN per send. The
    # content of the messages is covered by MailTemplatesTest, and the side effect that matters
    # — the token row — is verified in the database.
    com.securityhub.mail: ERROR
    org.testcontainers: WARN
    com.github.dockerjava: WARN
