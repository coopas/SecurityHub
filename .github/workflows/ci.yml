name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Testcontainers starts PostgreSQL 15 itself; the runner already provides a
      # Docker daemon, so no service container is declared here.
      - name: Test
        working-directory: backend
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # O setup-node guarda ~/.npm, mas o postinstall do puppeteer baixa ~500 MB de
      # binários do Chrome para ~/.cache/puppeteer, que fica de fora. Sem este cache o
      # download se repete a cada execução e um estol dele trava o `npm ci`.
      - name: Cache Chrome do puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install
        working-directory: frontend
        timeout-minutes: 10
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test:ci

      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s|^SECURITYHUB_JWT_SECRET=.*|SECURITYHUB_JWT_SECRET=$(openssl rand -base64 48)|" .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      # A suíte Cypress entra aqui, entre o smoke test e o descarte: a pilha já está de pé com
      # o seed do perfil `demo`, e os passos de dump e teardown abaixo continuam cobrindo
      # também as falhas dela. Rodar contra o compose — e não contra `ng serve` — é o que faz
      # o teste exercitar o bundle de produção atrás do nginx real.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # O binário do Cypress fica fora de node_modules e não é coberto pelo cache do npm.
      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: End-to-end (Cypress)
        working-directory: frontend
        env:
          CYPRESS_BASE_URL: http://localhost:8081
          # A mesma senha que o .env.example copiado no início do job entrega ao seed.
          CYPRESS_DEMO_PASSWORD: Demo@SecurityHub2026
        run: npm run e2e:ci

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Relatório completo das dependências que chegam ao navegador. Informativo: os achados
      # remanescentes são do próprio Angular, não têm vetor alcançável nesta aplicação e
      # estão analisados em docs/security-dependencies.md.
      - name: npm audit report (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev || true

      # O portão real. Antes ele falhava em `high` com continue-on-error, o que deixava o job
      # permanentemente vermelho por achados conhecidos e aceitos — um alarme que ninguém mais
      # lê. O nível reflete a política do projeto: nenhuma vulnerabilidade
      # crítica em dependência de produção. Assim o job passa hoje e quebra de verdade quando
      # uma nova crítica aparecer.
      - name: Fail on critical advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical
