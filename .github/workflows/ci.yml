name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Testcontainers starts PostgreSQL 15 itself; the runner already provides a
      # Docker daemon, so no service container is declared here.
      - name: Test
        working-directory: backend
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-node keeps ~/.npm, but puppeteer's postinstall downloads ~500 MB of
      # Chrome binaries into ~/.cache/puppeteer, which is left out of it. Without this cache the
      # download repeats on every run, and a stall in it hangs `npm ci`.
      - name: Cache puppeteer's Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install
        working-directory: frontend
        timeout-minutes: 10
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test:ci

      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s|^SECURITYHUB_JWT_SECRET=.*|SECURITYHUB_JWT_SECRET=$(openssl rand -base64 48)|" .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      # The Cypress suite goes here, between the smoke test and the teardown: the stack is
      # already up with the `demo` profile seed, and the dump and teardown steps below cover
      # its failures too. Running against compose — and not against `ng serve` — is what makes
      # the test exercise the production bundle behind the real nginx.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Cypress binary lives outside node_modules and is not covered by the npm cache.
      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: End-to-end (Cypress)
        working-directory: frontend
        env:
          CYPRESS_BASE_URL: http://localhost:8081
          # The same password the .env.example copied at the start of the job hands the seed.
          CYPRESS_DEMO_PASSWORD: Demo@SecurityHub2026
        run: npm run e2e:ci

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Full report of the dependencies that reach the browser. Informational: the remaining
      # findings are Angular's own, have no reachable vector in this application, and are
      # analysed in docs/security-dependencies.md.
      - name: npm audit report (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev || true

      # The real gate. It used to fail at `high` with continue-on-error, which left the job
      # permanently red over known and accepted findings — an alarm nobody reads any more. The
      # level reflects the project's policy: no critical vulnerability in a production
      # dependency. This way the job passes today and genuinely breaks when a new critical one
      # shows up.
      - name: Fail on critical advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical
