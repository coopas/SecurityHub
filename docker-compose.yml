services:
  postgres:
    image: postgres:15-alpine
    container_name: securityhub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securityhub}
      POSTGRES_USER: ${POSTGRES_USER:-securityhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securityhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securityhub} -d ${POSTGRES_DB:-securityhub}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securityhub-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-securityhub}
      DB_USER: ${POSTGRES_USER:-securityhub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-securityhub}
      SECURITYHUB_JWT_SECRET: ${SECURITYHUB_JWT_SECRET:?defina SECURITYHUB_JWT_SECRET no .env}
      SECURITYHUB_JWT_EXPIRATION_MINUTES: ${SECURITYHUB_JWT_EXPIRATION_MINUTES:-60}
      SECURITYHUB_REFRESH_EXPIRATION_DAYS: ${SECURITYHUB_REFRESH_EXPIRATION_DAYS:-14}
      SECURITYHUB_CORS_ALLOWED_ORIGINS: ${SECURITYHUB_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      SECURITYHUB_ATTACHMENTS_DIR: /var/securityhub/uploads
      SECURITYHUB_SCAN_DIR: /var/securityhub/uploads-scan
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      SECURITYHUB_MAIL_FROM: ${SECURITYHUB_MAIL_FROM:-nao-responda@securityhub.local}
      SECURITYHUB_APP_BASE_URL: ${SECURITYHUB_APP_BASE_URL:-http://localhost:8081}
      # Senha das contas criadas pelo seed do perfil `demo`. Credencial pública da
      # demonstração local, e não um segredo: o tenant `demo` vive apenas no banco que este
      # compose acabou de subir na máquina de quem clonou o repositório. Sobrescreva em
      # qualquer implantação exposta, ou desligue o seed com SPRING_PROFILES_ACTIVE=prod.
      SECURITYHUB_DEMO_PASSWORD: ${SECURITYHUB_DEMO_PASSWORD:-Demo@SecurityHub2026}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      # Porta de gestão (actuator). O bind em 127.0.0.1 não é cosmético. O contexto filho da
      # porta de gestão herda a cadeia de segurança da aplicação, então /actuator aqui exige um
      # token — mas o de qualquer usuário de qualquer papel, inclusive VIEWER, porque a regra
      # é o mesmo `anyRequest().authenticated()` da API. Publicar esta porta em 0.0.0.0
      # devolveria o vazamento que a mudança fechou, bastando uma conta comum para lê-lo.
      - "127.0.0.1:${MANAGEMENT_PORT:-9090}:9090"
    volumes:
      - attachments-data:/var/securityhub/uploads
      # Volume próprio, e não uma pasta dentro do de anexos: o relatório de uma
      # importação descartada é lixo, enquanto o anexo que alguém prendeu a um achado
      # é evidência. Retenções diferentes não dividem o mesmo volume.
      - scan-data:/var/securityhub/uploads-scan
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securityhub-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Caixa de entrada local para os links de recuperação de senha e convite: SMTP em 1025,
  # interface web em 8025. Sem healthcheck e sem depends_on de propósito — a imagem não tem
  # shell para um healthcheck e o backend tolera SMTP indisponível (ver docs/adr/0007).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: securityhub-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  attachments-data:
  scan-data:
