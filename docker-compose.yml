services:
  postgres:
    image: postgres:15-alpine
    container_name: securityhub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securityhub}
      POSTGRES_USER: ${POSTGRES_USER:-securityhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securityhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securityhub} -d ${POSTGRES_DB:-securityhub}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securityhub-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-securityhub}
      DB_USER: ${POSTGRES_USER:-securityhub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-securityhub}
      SECURITYHUB_JWT_SECRET: ${SECURITYHUB_JWT_SECRET:?defina SECURITYHUB_JWT_SECRET no .env}
      SECURITYHUB_JWT_EXPIRATION_MINUTES: ${SECURITYHUB_JWT_EXPIRATION_MINUTES:-60}
      SECURITYHUB_REFRESH_EXPIRATION_DAYS: ${SECURITYHUB_REFRESH_EXPIRATION_DAYS:-14}
      SECURITYHUB_CORS_ALLOWED_ORIGINS: ${SECURITYHUB_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      SECURITYHUB_ATTACHMENTS_DIR: /var/securityhub/uploads
      SECURITYHUB_SCAN_DIR: /var/securityhub/uploads-scan
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      SECURITYHUB_MAIL_FROM: ${SECURITYHUB_MAIL_FROM:-nao-responda@securityhub.local}
      SECURITYHUB_APP_BASE_URL: ${SECURITYHUB_APP_BASE_URL:-http://localhost:8081}
      # Password of the accounts created by the `demo` profile seed. A public credential of the
      # local demonstration, not a secret: the `demo` tenant lives only in the database this
      # compose has just brought up on the machine of whoever cloned the repository. Override it
      # in any exposed deployment, or turn the seed off with SPRING_PROFILES_ACTIVE=prod.
      SECURITYHUB_DEMO_PASSWORD: ${SECURITYHUB_DEMO_PASSWORD:-Demo@SecurityHub2026}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      # Management (actuator) port. Binding it to 127.0.0.1 is not cosmetic. The management
      # port's child context inherits the application's security chain, so /actuator here does
      # require a token — but the token of any user of any role, VIEWER included, because the
      # rule is the same `anyRequest().authenticated()` as the API's. Publishing this port on
      # 0.0.0.0 would hand back the leak that change closed, with an ordinary account enough
      # to read it.
      - "127.0.0.1:${MANAGEMENT_PORT:-9090}:9090"
    volumes:
      - attachments-data:/var/securityhub/uploads
      # Its own volume, and not a folder inside the attachments one: the report of a discarded
      # import is garbage, while an attachment somebody pinned to a finding is evidence.
      # Different retentions do not share a volume.
      - scan-data:/var/securityhub/uploads-scan
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securityhub-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Local inbox for the password recovery and invitation links: SMTP on 1025, web interface on
  # 8025. No healthcheck and no depends_on on purpose — the image has no shell for a healthcheck
  # and the backend tolerates an unavailable SMTP (see docs/adr/0007).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: securityhub-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  attachments-data:
  scan-data:
