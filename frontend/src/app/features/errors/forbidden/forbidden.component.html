<div class="error-page">
  <section class="error-card">
    <p class="error-card__mark">
      <mat-icon aria-hidden="true">shield</mat-icon>
      <span>SecurityHub</span>
    </p>

    <div class="error-card__status">
      <span class="error-card__icon error-card__icon--denied">
        <mat-icon aria-hidden="true">lock</mat-icon>
      </span>
      <p class="error-card__code">403</p>
    </div>

    <h1 class="error-card__title">Acesso negado</h1>
    <p class="error-card__message">
      Seu perfil não tem permissão para acessar esta área. Se você acredita que isso é um engano,
      fale com o administrador da sua empresa.
    </p>

    <div class="error-card__actions">
      <a mat-raised-button color="primary" routerLink="/dashboard">Voltar ao dashboard</a>
      <a mat-stroked-button routerLink="/login">Entrar com outra conta</a>
    </div>
  </section>
</div>
