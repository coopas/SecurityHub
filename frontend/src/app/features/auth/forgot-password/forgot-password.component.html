<div class="auth-page">
  <mat-card class="auth-card">
    <p class="auth-card__brand">
      <mat-icon aria-hidden="true">security</mat-icon>
      <span>SecurityHub</span>
    </p>

    <h1 class="auth-card__title">Esqueci minha senha</h1>

    <ng-container *ngIf="!submitted; else sent">
      <p class="auth-card__subtitle">
        Informe o e-mail da sua conta e enviaremos um link para definir uma senha nova.
      </p>

      <p class="auth-alert" role="alert" *ngIf="generalError">{{ generalError }}</p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="email"
            data-testid="forgot-email"
          />
          <mat-error *ngIf="form.controls['email'].hasError('required')">Informe o e-mail.</mat-error>
          <mat-error *ngIf="form.controls['email'].hasError('email')">Informe um e-mail válido.</mat-error>
          <mat-error *ngIf="form.controls['email'].hasError('server')">
            {{ form.controls['email'].getError('server') }}
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="auth-form__submit"
          [disabled]="submitting"
          data-testid="forgot-submit"
        >
          <mat-spinner *ngIf="submitting" diameter="20" aria-hidden="true"></mat-spinner>
          <span>{{ submitting ? 'Enviando...' : 'Enviar link' }}</span>
        </button>
      </form>
    </ng-container>

    <ng-template #sent>
      <p class="auth-card__subtitle" role="status" data-testid="forgot-neutral">
        {{ neutralMessage }}
      </p>
    </ng-template>

    <p class="auth-footer">
      <a routerLink="/login">Voltar para o login</a>
    </p>
  </mat-card>
</div>
