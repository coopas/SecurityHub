<!-- A state is an answer, not a hole in the screen: medallion, sentence and, on error, an exit. -->
<div
  class="sh-state state-message"
  [ngClass]="'state-message--' + state"
  role="status"
  aria-live="polite"
>
  <span class="state-message__figure" aria-hidden="true">
    <mat-spinner *ngIf="state === 'loading'" diameter="28"></mat-spinner>
    <mat-icon *ngIf="state !== 'loading'" class="state-message__icon">{{ icon }}</mat-icon>
  </span>

  <p class="state-message__text">{{ text }}</p>

  <button
    *ngIf="showRetry && state === 'error'"
    mat-stroked-button
    color="primary"
    type="button"
    class="state-message__retry"
    (click)="retry.emit()"
  >
    <mat-icon aria-hidden="true">refresh</mat-icon>
    <span>{{ retryLabel }}</span>
  </button>
</div>
