<!-- The icon and the color band tell "apagar para sempre" apart from "confirmar": the
     destructive question has to look different before it is read. -->
<h2
  mat-dialog-title
  id="confirm-dialog-title"
  class="confirm-dialog__title"
  [class.confirm-dialog__title--destructive]="data.destructive"
>
  <span class="confirm-dialog__badge" aria-hidden="true">
    <mat-icon>{{ data.destructive ? 'delete_outline' : 'help_outline' }}</mat-icon>
  </span>
  <span class="confirm-dialog__heading">{{ data.title }}</span>
</h2>

<div mat-dialog-content class="confirm-dialog__content">
  <p class="confirm-dialog__message">{{ data.message }}</p>
</div>

<div mat-dialog-actions align="end" class="confirm-dialog__actions">
  <button mat-stroked-button type="button" (click)="cancel()">{{ cancelLabel }}</button>
  <button
    mat-raised-button
    type="button"
    cdkFocusInitial
    class="confirm-dialog__confirm"
    [class.confirm-dialog__confirm--destructive]="data.destructive"
    [color]="data.destructive ? 'warn' : 'primary'"
    (click)="confirm()"
  >
    {{ confirmLabel }}
  </button>
</div>
