<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SecurityHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestão de ativos e vulnerabilidades de segurança">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!--
    Paints the theme before the first frame. If this waited for Angular to boot, whoever uses
    dark mode would see a white flash on every visit — and it is precisely the light screen
    that hurts in the dark, not the other way round. Reads the saved choice and, on the first
    visit, obeys the system preference.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('securityhub.theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        /* Private mode blocks storage: the light theme is a perfectly good default. */
      }
    })();
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
