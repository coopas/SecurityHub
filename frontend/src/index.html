<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SecurityHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestão de ativos e vulnerabilidades de segurança">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!--
    Pinta o tema antes do primeiro quadro. Se isto esperasse o Angular subir, quem usa o
    modo escuro veria um lampejo branco em toda visita — e é justamente a tela clara que
    machuca no escuro, não o contrário. Lê a escolha salva e, na primeira visita, obedece
    à preferência do sistema.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('securityhub.theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        /* Modo privativo bloqueia o storage: o tema claro é um padrão perfeitamente bom. */
      }
    })();
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
